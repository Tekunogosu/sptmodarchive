name: Refresh archive

# Two halves of the archive go stale on different clocks, so one scheduled run
# does both, in the order their data depends on:
#
#   scrape_mods.py    the Forge listings, which exist only until it shuts down
#   scrape_addons.py  the addons published against those mods
#   fetch_images.py   thumbnails for whatever the two above just added
#   repo_status.py    the source repositories, which outlive it
#
# Mods go first because data/mods.json is the spine: everything after reads it.
# Addons follow, then images, which mirror the thumbnails of both and so need
# each file already written. repo_status.py reads every source link out of
# mods.json, so a mod added this run has its repository checked in the same run
# rather than hours later.
#
# AFTER THE FORGE SHUTS DOWN: delete the "Scrape the Forge", "Scrape addons"
# and "Mirror new images" steps, and drop data/mods.json, data/raw_mods.jsonl,
# data/addons.json and data/images from the commit step. Only repo_status.py
# avoids sp-tarkov.com entirely, so it is the one that keeps running forever.
on:
  schedule:
    - cron: "0 * * * *"         # hourly, with the shutdown approaching
  workflow_dispatch:            # and on demand from the Actions tab

# Build and deploy happen in this one workflow rather than by pushing and
# letting build.yml pick it up: a push made with GITHUB_TOKEN does not trigger
# other workflows, so relying on that would commit fresh data and never
# publish it.
permissions:
  contents: write               # to commit the refreshed data back
  pages: write
  id-token: write

# Pages allows one deployment at a time. Sharing this group with build.yml
# means a scheduled run and a push cannot race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A scrape that hangs should lose its run, not sit on a runner for six
    # hours while the next scheduled run queues up behind it.
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The per-mod fetch cache (data/raw_mods.jsonl) is committed, so the
      # checkout above already restored it: this run refetches only the mods
      # whose updated_at moved, rather than all ~1,800 of them. That is what
      # makes an hourly schedule defensible against a dying server.
      - name: Scrape the Forge
        # Never fatal. scrape_mods.py aborts without writing when enumeration
        # comes back empty or short, so the worst case is that this run
        # publishes the mod data already in the repo. That is also exactly what
        # every run looks like once the Forge is gone, and it must not stop the
        # repository status below from refreshing.
        continue-on-error: true
        run: python3 scrape/scrape_mods.py

      # Same reasoning as above: aborts without writing rather than truncating,
      # so a dead Forge republishes the addons already in the repo. There is no
      # fetch cache here -- the whole catalogue is ~160 requests -- so this is
      # a full re-scrape every run, at about a minute.
      - name: Scrape addons
        continue-on-error: true
        run: python3 scrape/scrape_addons.py

      # Pillow is needed only by this step, which is why it is installed here
      # rather than in build.yml: nothing else in the project imports it, and
      # fetch_images.py imports it lazily so the other steps do not care.
      - name: Install image tooling
        run: pip install --disable-pip-version-check --quiet Pillow

      # Only downloads what the manifest does not already have, so a normal run
      # fetches the handful of thumbnails belonging to mods and addons added
      # since the last one. These images live on forge-static.sp-tarkov.com and
      # are the part of the archive that cannot be re-fetched later.
      - name: Mirror new images
        continue-on-error: true
        run: python3 scrape/fetch_images.py

      - name: Check source repositories
        env:
          # The built-in token reads public repository data fine, at
          # 1,000 requests/hour -- far more than the ~30 GraphQL calls this
          # needs. No personal access token has to be stored anywhere.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scrape/repo_status.py --max-age 0

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mods.json data/raw_mods.jsonl data/repos.json \
                  data/addons.json data/images.json data/images

          if git diff --cached --quiet; then
            echo "Nothing changed since the last run."
            exit 0
          fi

          git commit -m "Refresh archive [skip ci]"

          # A maintainer may have pushed while this ran. Rebase onto them
          # rather than clobbering; if that conflicts, drop this run's commit
          # -- the data is regenerated from scratch every time anyway, so the
          # next run fixes it. Never force-push a shared branch.
          if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
            git rebase --abort || true
            echo "::warning::Rebase conflicted; skipping this commit."
            git reset --hard "origin/${GITHUB_REF_NAME}"
          fi

          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build the site
        run: python3 build/build.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@v5
